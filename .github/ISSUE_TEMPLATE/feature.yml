name: Feature Request
description: Suggest an improvement or new feature for AntiDPEye
title: "[Feature]: "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to AntiDPEye.

        Please describe the problem your proposal would solve and explain how the feature should work.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem would this feature solve? Describe who is affected and when the problem occurs.
      placeholder: |
        I would like to ...
        This would help because ...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Clearly describe the feature or improvement you would like to see.
      placeholder: |
        Add an option that ...
        When the user ..., AntiDPEye should ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions, workarounds, or existing features you have considered.
      placeholder: |
        I have tried ...
        Another possible solution would be ...
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other information that may help explain or evaluate the proposal, such as screenshots, mockups, examples, or related projects.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I have searched the open and closed issues for duplicates.
          required: true
        - label: I have verified that this feature does not already exist.
          required: true
        - label: This request is specifically related to AntiDPEye.
          required: true
