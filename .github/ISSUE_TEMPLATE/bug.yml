name: Bug Report
description: Report a reproducible bug in AntiDPEye
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        Before submitting, please search the open and closed issues to make sure the problem has not already been reported.

  - type: textarea
    id: bug
    attributes:
      label: Bug description
      description: Clearly and concisely describe the problem.
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide clear, numbered steps that consistently reproduce the problem.
      placeholder: |
        1. Open AntiDPEye.
        2. Enable ...
        3. Configure ...
        4. Tap ...
        5. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe what happened instead. Include any error messages.
      placeholder: What happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        If available, attach relevant logs or crash reports. Remove passwords, tokens, personal information, and other sensitive data before posting.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recordings
      description: If applicable, attach screenshots or a short screen recording that demonstrates the issue.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide the following information.
      value: |
        - Device:
        - Android version:
        - AntiDPEye version:
        - Installation source:
        - Rooted device: Yes/No
        - VPN or other network-related apps:
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: AntiDPEye configuration
      description: |
        Include the relevant AntiDPEye settings, arguments, or configuration used when the issue occurred. Remove any sensitive information.
      render: text

  - type: textarea
    id: network
    attributes:
      label: Network details
      description: |
        If relevant, provide details about your connection and whether the issue also occurs on other networks.
      value: |
        - Connection type: Wi-Fi / Mobile data / Other
        - Internet service provider:
        - Occurs on other networks: Yes/No/Not tested

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other information that may help diagnose the issue.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I have searched the open and closed issues for duplicates.
          required: true
        - label: I have included enough information to reproduce the issue.
          required: true
        - label: I have removed passwords, tokens, personal data, and other sensitive information.
          required: true
        - label: This is a bug report, not a question, feature request, or general feedback.
          required: true
